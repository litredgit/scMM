name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.plan.outputs.run }}
      node: ${{ steps.plan.outputs.node }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select local/full or automatic lightweight plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # A main fast-forward containing only commits already on dev adds no new code.
          # Unique main commits, initial pushes and PRs still receive checks.
          if [ "$EVENT_NAME" = push ] && [ "$REF_NAME" = main ]; then
            before=$(python -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["before"])')
            if [ "$before" != 0000000000000000000000000000000000000000 ] && git show-ref --verify --quiet refs/remotes/origin/dev; then
              novel=$(git rev-list "$before..$GITHUB_SHA" --not origin/dev)
              if [ -z "$novel" ]; then
                echo 'run=false' >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi
          echo 'run=true' >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            python scripts/test_blocks.py --all --write-plan /tmp/test-plan.json --github-output "$GITHUB_OUTPUT"
          else
            python scripts/test_blocks.py --ci-event "$GITHUB_EVENT_PATH" --lightweight --write-plan /tmp/test-plan.json --github-output "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.run == 'true'
        with:
          name: test-plan
          path: /tmp/test-plan.json

  checks:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["3.11", "3.12"]' || '["3.12"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: test-plan
          path: /tmp
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked plan dependencies
        run: |
          python - <<'PY'
          import json, subprocess
          plan = json.load(open('/tmp/test-plan.json'))
          command = ['uv', 'sync', '--locked']
          command += ['--dev'] if plan['python_paths'] or plan['browser_paths'] else ['--only-group', 'dev']
          for extra in sorted(set(plan['extras'] + plan['browser_extras'])):
              command += ['--extra', extra]
          subprocess.run(command, check=True)
          PY
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.node == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        if: needs.changes.outputs.node == 'true'
        run: npm --prefix frontend ci
      - name: Install Chromium for manual full checks
        if: github.event_name == 'workflow_dispatch'
        run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - name: Run the shared check entry
        run: uv run --no-sync python scripts/test_blocks.py --plan /tmp/test-plan.json --run
