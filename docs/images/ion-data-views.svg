<svg xmlns="http://www.w3.org/2000/svg" width="640" height="315" viewBox="0 0 640 315" role="img" aria-labelledby="title description">
  <title id="title">离子数据视图</title>
  <desc id="description">L1 和 L2 均来自 L0 测量根。L3 单独管理候选与证据，不改数值矩阵。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#56728e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="315" rx="16" fill="#f8fbfe" stroke="none"/>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif">
    <rect x="166" y="14" width="308" height="84" rx="12" fill="#edf4fc" stroke="#bacfe5"/>
    <text x="320" y="47" font-size="25" font-weight="700" fill="#24568c" text-anchor="middle">L0 · 原始测量矩阵</text>
    <text x="320" y="78" font-size="21" font-weight="400" fill="#385570" text-anchor="middle">保留所有已测量特征</text>
    <path d="M240 101 V124 H164 V144" fill="none" stroke="#56728e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M400 101 V124 H476 V144" fill="none" stroke="#56728e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="16" y="151" width="296" height="83" rx="12" fill="#e9f6f1" stroke="#b3d9cb"/>
    <text x="164" y="185" font-size="24" font-weight="700" fill="#126352" text-anchor="middle">L1 · 去冗余特征</text>
    <text x="164" y="214" font-size="20" font-weight="400" fill="#385570" text-anchor="middle">按同位素或离子组选代表</text>
    <rect x="328" y="151" width="296" height="83" rx="12" fill="#e9f6f1" stroke="#b3d9cb"/>
    <text x="476" y="185" font-size="24" font-weight="700" fill="#126352" text-anchor="middle">L2 · 化合物组定量</text>
    <text x="476" y="214" font-size="20" font-weight="400" fill="#385570" text-anchor="middle">每组使用固定代表离子</text>
    <rect x="16" y="249" width="608" height="51" rx="12" fill="#fff5e4" stroke="#ebd5aa"/>
    <text x="320" y="281" font-size="23" font-weight="700" fill="#785117" text-anchor="middle">L3 · 候选与证据单独管理</text>
  </g>
</svg>
