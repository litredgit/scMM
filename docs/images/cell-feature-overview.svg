<svg xmlns="http://www.w3.org/2000/svg" width="960" height="474" viewBox="0 0 960 474" role="img" aria-labelledby="title desc">
<title id="title">SNR 提取流程总览</title><desc id="desc">六步依次为原始扫描、候选特征、扫描信号、细胞窗口、矩阵、人工审核。矩阵内的零值筛列先于审核，后续质控在审核纳入后。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#66758a"/></marker></defs>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="960" height="474" rx="10" fill="#ffffff" stroke="none"/><text x="32" y="42" font-size="26" fill="#243449" text-anchor="start" font-weight="bold">从扫描到矩阵：先提取，再审核</text><text x="32" y="74" font-size="18" fill="#66758a" text-anchor="start" font-weight="normal">snr_v1 · 从原始谱到细胞事件 × m/z 特征矩阵</text><rect x="32" y="106" width="276" height="106" rx="10" fill="#edf4fb" stroke="none"/><text x="50" y="142" font-size="23" fill="#243449" text-anchor="start" font-weight="bold">1  原始扫描</text><text x="50" y="182" font-size="19" fill="#243449" text-anchor="start" font-weight="normal">按时间排列的谱</text><line x1="312" y1="159" x2="334" y2="159" stroke="#66758a" stroke-width="2" marker-end="url(#arrow)"/><rect x="342" y="106" width="276" height="106" rx="10" fill="#edf4fb" stroke="none"/><text x="360" y="142" font-size="23" fill="#243449" text-anchor="start" font-weight="bold">2  候选特征</text><text x="360" y="182" font-size="19" fill="#243449" text-anchor="start" font-weight="normal">汇总、去噪与找峰</text><line x1="622" y1="159" x2="644" y2="159" stroke="#66758a" stroke-width="2" marker-end="url(#arrow)"/><rect x="652" y="106" width="276" height="106" rx="10" fill="#edf4fb" stroke="none"/><text x="670" y="142" font-size="23" fill="#243449" text-anchor="start" font-weight="bold">3  扫描信号</text><text x="670" y="182" font-size="19" fill="#243449" text-anchor="start" font-weight="normal">质量匹配到候选轴</text><rect x="32" y="256" width="276" height="106" rx="10" fill="#edf4fb" stroke="none"/><text x="50" y="292" font-size="23" fill="#243449" text-anchor="start" font-weight="bold">4  细胞窗口</text><text x="50" y="332" font-size="19" fill="#243449" text-anchor="start" font-weight="normal">参考信号连续通过</text><line x1="312" y1="309" x2="334" y2="309" stroke="#66758a" stroke-width="2" marker-end="url(#arrow)"/><rect x="342" y="256" width="276" height="106" rx="10" fill="#edf4fb" stroke="none"/><text x="360" y="292" font-size="23" fill="#243449" text-anchor="start" font-weight="bold">5  矩阵</text><text x="360" y="332" font-size="19" fill="#243449" text-anchor="start" font-weight="normal">净峰高定量、零值筛列</text><line x1="622" y1="309" x2="644" y2="309" stroke="#66758a" stroke-width="2" marker-end="url(#arrow)"/><rect x="652" y="256" width="276" height="106" rx="10" fill="#e9f5ef" stroke="none"/><text x="670" y="292" font-size="23" fill="#243449" text-anchor="start" font-weight="bold">6  人工审核</text><text x="670" y="332" font-size="19" fill="#243449" text-anchor="start" font-weight="normal">选择纳入样本</text><path d="M 894 216 L 894 234 L 170 234 L 170 250" fill="none" stroke="#66758a" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="407" font-size="22" fill="#243449" text-anchor="start" font-weight="bold">矩阵：行 = 细胞事件　列 = m/z 特征　值 = 检出净峰高</text><text x="32" y="443" font-size="20" fill="#243449" text-anchor="start" font-weight="normal">人工审核纳入后建立当前数据集，再按需要进行后续质控与主动保存。</text></g></svg>